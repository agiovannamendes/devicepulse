<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 830" width="1520" height="830" role="img" aria-label="C4 nível 2: contêineres do DevicePulse"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4777a7"/></marker></defs><rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/><text x="50" y="58" font-size="29" font-weight="700" fill="#173d63" text-anchor="start" font-family="Arial,Helvetica,sans-serif">C4 L2 — Contêineres e protocolos</text><text x="50" y="88" font-size="15" font-weight="400" fill="#56718b" text-anchor="start" font-family="Arial,Helvetica,sans-serif">A arquitetura proposta usa um único backend modular, uma SPA React e PostgreSQL</text><rect x="408" y="132" width="1060" height="617" rx="16" fill="#f8fbff" stroke="#a7c2db" stroke-width="2"/><text x="435" y="167" font-size="18" font-weight="700" fill="#365e87" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Fronteira de software: DevicePulse</text><rect x="64" y="230" width="272" height="140" rx="14" fill="#f5f7fa" stroke="#8796aa" stroke-width="2"/><text x="200" y="278" font-size="22" font-weight="700" fill="#26384d" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Operador</text><text x="200" y="306" font-size="15" font-weight="400" fill="#576b80" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">[Pessoa]</text><text x="200" y="338" font-size="15" font-weight="400" fill="#42576a" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Usa o navegador</text><rect x="61" y="545" width="275" height="142" rx="14" fill="#f5f7fa" stroke="#8796aa" stroke-width="2"/><text x="199" y="593" font-size="22" font-weight="700" fill="#26384d" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Simulador</text><text x="199" y="624" font-size="15" font-weight="400" fill="#576b80" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">[Node.js CLI externo]</text><text x="199" y="653" font-size="15" font-weight="400" fill="#42576a" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Evento a cada 60 s</text><rect x="468" y="238" width="283" height="168" rx="14" fill="#eaf3fc" stroke="#2e6497" stroke-width="2"/><text x="609" y="279" font-size="21" font-weight="700" fill="#163e65" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Aplicação web</text><text x="609" y="308" font-size="16" font-weight="400" fill="#325e80" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">[React + Vite / SPA]</text><text x="609" y="342" font-size="15" font-weight="400" fill="#42576a" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Painel, cadastro,</text><text x="609" y="366" font-size="15" font-weight="400" fill="#42576a" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">filtros, histórico e alertas</text><rect x="883" y="226" width="357" height="187" rx="14" fill="#eaf3fc" stroke="#2e6497" stroke-width="2"/><text x="1061" y="268" font-size="22" font-weight="700" fill="#163e65" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Backend modular</text><text x="1061" y="299" font-size="16" font-weight="400" fill="#325e80" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">[Node.js + Express]</text><text x="1061" y="327" font-size="15" font-weight="400" fill="#42576a" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">REST, validação e regras</text><text x="1061" y="352" font-size="15" font-weight="400" fill="#42576a" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Verificador interno a cada 30 s</text><text x="1061" y="377" font-size="15" font-weight="400" fill="#42576a" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Processo único no MVP</text><rect x="883" y="538" width="357" height="139" rx="14" fill="#eaf6ef" stroke="#33745d" stroke-width="2"/><text x="1061" y="584" font-size="23" font-weight="700" fill="#20533e" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">PostgreSQL</text><text x="1061" y="612" font-size="16" font-weight="400" fill="#326f56" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">[Banco de dados]</text><text x="1061" y="641" font-size="15" font-weight="400" fill="#42695a" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">devices • device_events • alerts</text><path d="M336 300 L468 300" fill="none" stroke="#4777a7" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arr)"/><text x="401" y="273" font-size="13" font-weight="700" fill="#356999" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">Interface</text><text x="401" y="289" font-size="13" font-weight="400" fill="#356999" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">web</text><path d="M751 320 L883 320" fill="none" stroke="#4777a7" stroke-width="2.7" stroke-linejoin="round" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="817" y="286" font-size="14" font-weight="700" fill="#356999" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">REST / JSON</text><text x="817" y="306" font-size="13" font-weight="400" fill="#56718b" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">HTTP(S)</text><path d="M1061 413 L1061 538" fill="none" stroke="#4777a7" stroke-width="2.7" stroke-linejoin="round" marker-start="url(#arr)" marker-end="url(#arr)"/><text x="1077" y="465" font-size="14" font-weight="700" fill="#356999" text-anchor="start" font-family="Arial,Helvetica,sans-serif">SQL parametrizado / TCP</text><text x="1077" y="486" font-size="13" font-weight="400" fill="#56718b" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Transações e índices</text><path d="M336 615 L806 615 L806 422 L883 422" fill="none" stroke="#4777a7" stroke-width="2.7" stroke-linejoin="round" marker-end="url(#arr)"/><text x="525" y="585" font-size="14" font-weight="700" fill="#356999" text-anchor="start" font-family="Arial,Helvetica,sans-serif">POST / JSON — dados fictícios</text><text x="517" y="658" font-size="13" font-weight="400" fill="#56718b" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Sem acesso direto ao banco</text><text x="485" y="723" font-size="14" font-weight="400" fill="#546f85" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Atualização do painel: consultas periódicas configuráveis; nenhum WebSocket necessário.</text><text x="50" y="798" font-size="13" font-weight="400" fill="#64748b" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Legenda: setas mostram comunicação entre contêineres; o verificador de offline pertence ao backend.</text></svg>
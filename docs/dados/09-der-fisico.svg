<svg xmlns="http://www.w3.org/2000/svg" width="1470" height="660" viewBox="0 0 1470 660" role="img" aria-label="DP-009 — DER físico PostgreSQL">
<defs><marker id="arrow" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0 L10 4.5 L0 9 Z" fill="#436f9a"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#203c53}.link{fill:none;stroke:#436f9a;stroke-width:2.3;marker-end:url(#arrow)}</style></defs>
<rect width="1470" height="660" fill="#ffffff"/>
<text x="50" y="64" font-size="33" font-weight="bold">DP-009 — DER físico PostgreSQL</text>
<text x="50" y="100" font-size="17" fill="#61788b">Chaves, tipos, restrições e cardinalidades (DDL de referência)</text><rect x="50" y="190" width="345" height="290" rx="12" fill="#f6faff" stroke="#2b648f" stroke-width="2.2"/>
<rect x="50" y="190" width="345" height="48" rx="12" fill="#185780"/>
<rect x="50" y="220" width="345" height="18" fill="#185780"/>
<text x="67" y="222" font-size="21" fill="#ffffff" font-weight="bold">devices</text><text x="66" y="265" font-size="15">PK  id UUID</text><text x="66" y="291" font-size="15">UK  code VARCHAR(50)</text><text x="66" y="317" font-size="15">name VARCHAR(120)</text><text x="66" y="343" font-size="15">connectivity_status VARCHAR(12)</text><text x="66" y="369" font-size="15">last_battery_level SMALLINT?</text><text x="66" y="395" font-size="15">last_event_at TIMESTAMPTZ?</text><text x="66" y="421" font-size="15">created_at TIMESTAMPTZ</text><text x="66" y="447" font-size="15">updated_at TIMESTAMPTZ</text><rect x="525" y="190" width="360" height="290" rx="12" fill="#f6faff" stroke="#2b648f" stroke-width="2.2"/>
<rect x="525" y="190" width="360" height="48" rx="12" fill="#185780"/>
<rect x="525" y="220" width="360" height="18" fill="#185780"/>
<text x="542" y="222" font-size="21" fill="#ffffff" font-weight="bold">device_events</text><text x="541" y="265" font-size="15">PK  id UUID = eventId</text><text x="541" y="291" font-size="15">FK  device_id UUID</text><text x="541" y="317" font-size="15">occurred_at TIMESTAMPTZ</text><text x="541" y="343" font-size="15">received_at TIMESTAMPTZ</text><text x="541" y="369" font-size="15">battery_level SMALLINT [0..100]</text><text x="541" y="395" font-size="15">UK  (id, device_id)</text><rect x="1020" y="190" width="375" height="290" rx="12" fill="#f6faff" stroke="#2b648f" stroke-width="2.2"/>
<rect x="1020" y="190" width="375" height="48" rx="12" fill="#185780"/>
<rect x="1020" y="220" width="375" height="18" fill="#185780"/>
<text x="1037" y="222" font-size="21" fill="#ffffff" font-weight="bold">alerts</text><text x="1036" y="265" font-size="15">PK  id UUID</text><text x="1036" y="291" font-size="15">FK  device_id UUID</text><text x="1036" y="317" font-size="15">FK  source_event_id UUID?</text><text x="1036" y="343" font-size="15">alert_type VARCHAR(20)</text><text x="1036" y="369" font-size="15">opened_at TIMESTAMPTZ</text><text x="1036" y="395" font-size="15">acknowledged_at TIMESTAMPTZ?</text><text x="1036" y="421" font-size="15">resolved_at TIMESTAMPTZ?</text><text x="1036" y="447" font-size="15">UK parcial: aberto por device/tipo</text><path class="link" d="M395 323 L500 323 L500 323 L525 323"/>
<path class="link" d="M222.5 480 L222.5 557 L1207.5 557 L1207.5 480"/>
<path class="link" d="M885 347 L1020 347"/>
<text x="406" y="306" font-size="16">1 : N</text>
<text x="950" y="546" font-size="16">1 : N</text>
<text x="898" y="330" font-size="16">0..1 : N</text>
<text x="52" y="608" font-size="15" fill="#66798b">PK = chave primária • FK = chave estrangeira • UK = unicidade • ? = campo opcional</text>
<text x="52" y="635" font-size="14" fill="#66798b">Fonte editável: 09-der-fisico.mmd • Projeto fictício DevicePulse • DP-009</text></svg>